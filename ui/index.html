<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arkion HSM Signing Service</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-brand">
        <div class="shield-badge">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
        </div>
        <div>
          <h1 class="header-title">Arkion HSM Signing Service</h1>
          <p class="header-subtitle">Rust • Axum • PKCS#11 • SoftHSM2</p>
        </div>
      </div>
      <div class="header-actions">
        <div class="status-indicator online" id="statusIndicator">
          <span class="status-dot"></span>
          <span class="status-label" id="statusLabel">Service Online</span>
        </div>
        <button type="button" class="btn btn-icon" id="btnHealth" title="Run Health Check">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path></svg>
          <span>Health Check</span>
        </button>
      </div>
    </header>

    <!-- Execution Flow -->
    <section class="flow-section">
      <div class="flow-header">
        <span class="section-tag">Cryptographic Pipeline</span>
      </div>
      <div class="flow-pipeline">
        <div class="flow-node">
          <span class="node-icon">📄</span>
          <span class="node-text">Payload</span>
        </div>
        <div class="flow-connector">➔</div>
        <div class="flow-node">
          <span class="node-icon">⚡</span>
          <span class="node-text">Axum API</span>
        </div>
        <div class="flow-connector">➔</div>
        <div class="flow-node">
          <span class="node-icon">🔌</span>
          <span class="node-text">PKCS#11</span>
        </div>
        <div class="flow-arrow-connector">➔</div>
        <div class="flow-node">
          <span class="node-icon">🔑</span>
          <span class="node-text">SoftHSM</span>
        </div>
        <div class="flow-connector">➔</div>
        <div class="flow-node flow-node-accent">
          <span class="node-icon">🔏</span>
          <span class="node-text">ECDSA Signature</span>
        </div>
      </div>
    </section>

    <!-- Main Content Layout -->
    <div class="dashboard-grid">
      <!-- Request Form Card -->
      <section class="card">
        <div class="card-header">
          <div class="card-title-group">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <h2>HSM Signing Request</h2>
          </div>
        </div>

        <form id="signForm" onsubmit="event.preventDefault(); handleSign();">
          <div class="form-group">
            <label for="keyId">Key Identity (CKA_LABEL)</label>
            <input type="text" id="keyId" value="arkion-intermediate-prod" autocomplete="off" required spellcheck="false">
          </div>

          <div class="form-group">
            <label for="algorithm">Cryptographic Algorithm</label>
            <select id="algorithm">
              <option value="ECDSA_P256_SHA256">ECDSA_P256_SHA256 (P-256 + SHA-256)</option>
            </select>
          </div>

          <div class="form-group">
            <label for="payload">Payload Text</label>
            <textarea id="payload" rows="4" placeholder="Enter plaintext payload to sign..." spellcheck="false">Hello Arkion</textarea>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="btnSign">
              <span id="btnSignText">Sign with HSM</span>
              <div class="spinner hidden" id="signSpinner"></div>
            </button>
            <button type="button" class="btn btn-secondary" onclick="handleClear()">Clear</button>
          </div>
        </form>
      </section>

      <!-- Result Panel Card -->
      <section class="card" id="resultCard">
        <div class="card-header">
          <div class="card-title-group">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            <h2>Cryptographic Result</h2>
          </div>
          <span class="badge badge-idle" id="resultBadge">Awaiting Request</span>
        </div>

        <!-- Banner Feedback -->
        <div id="feedbackBanner" class="banner hidden"></div>

        <!-- Result Content Output -->
        <div id="resultOutput" class="result-placeholder">
          <div class="placeholder-icon">🛡️</div>
          <p>Submit a request to execute non-exportable HSM signing.</p>
        </div>
      </section>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>

version: '3.8'

services:
  signing-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arkion-hsm-signing-service
    ports:
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - PKCS11_LIB_PATH=/usr/lib/softhsm/libsofthsm2.so
      - HSM_TOKEN_LABEL=arkion-token
      - HSM_SLOT_INDEX=0
      - HSM_USER_PIN=1234
      - HSM_SO_PIN=1234
      - HSM_SESSION_POOL_SIZE=4
      - HSM_ACQUISITION_TIMEOUT_MS=5000
      - HSM_OPERATION_TIMEOUT_MS=10000
      - HSM_ECDSA_KEY_LABEL=arkion-intermediate-prod
      - HSM_AES_KEY_LABEL=arkion-aes-key
    volumes:
      - softhsm-tokens:/var/lib/softhsm/tokens
    restart: unless-stopped

volumes:
  softhsm-tokens:
